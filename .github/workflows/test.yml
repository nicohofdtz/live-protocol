# Führt die Tests bei jedem Push aus.
#
# build.yml baut nur die Apps; ob die Tests grün sind, soll nicht davon
# abhängen, dass jemand von Hand nachsieht. Neue Pfade sollen nicht erst
# beim nächsten Termin auffallen.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Abhängigkeiten
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q
