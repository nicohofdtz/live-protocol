[project]
name = "live-protocol"
version = "0.8.0"
description = "Live-Mitschrift: Transkript und Protokoll während der Aufnahme"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # Strom-Dienste (Voxtral Realtime) sprechen WebSocket.
    "websockets>=13",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
